server:
  port: 8081
spring:
  application:
    name: health-blog-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/health_blog_db}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:sa}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ornsunlang7580@gmail.com}
    password: ${MAIL_PASSWORD:eupz hjil aqvw lpgl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  verification:
    code-expiry-minutes: ${VERIFICATION_CODE_EXPIRY_MINUTES:2}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:change-this-secret-to-a-long-random-production-value-32-bytes}
    access-token-minutes: ${SECURITY_JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${SECURITY_JWT_REFRESH_TOKEN_DAYS:7}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:health-blog}

notification:
  rabbitmq:
    exchange: ${NOTIFICATION_EXCHANGE:post.notification.exchange}
    queue: ${NOTIFICATION_QUEUE:post.notification.queue}
    routing-key: ${NOTIFICATION_ROUTING_KEY:post.notification.routingkey}

mail:
  from: ${MAIL_FROM:ornsunlang7580@gmail.com}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}